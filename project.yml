name: SvatekDnes
options:
  bundleIdPrefix: cz.fh
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: cs
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L7Y8Z76L4N
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Xcode would generate Color.brandGreen/.brandRed extensions from the
    # asset names, colliding with the documented ones in DesignSystem.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SvatekDnes:
    type: application
    platform: iOS
    sources:
      - path: SvatekDnes
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.fh.svatekdnes
        PRODUCT_NAME: SvatekDnes
        INFOPLIST_FILE: SvatekDnes/Info.plist
        CODE_SIGN_ENTITLEMENTS: SvatekDnes/SvatekDnes.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Archives must be distribution-signed at build time: the Xcode 26
        # direct-upload path ships the archive's binaries without
        # re-signing, so a development-signed archive is rejected with
        # error 90035 (see the release steps in the README). Uses the
        # manually created App Store profiles from the developer portal –
        # Xcode-managed profiles are not accepted by manual signing.
        # Target-level because xcodegen's platform presets set a
        # target-level CODE_SIGN_IDENTITY that beats project settings.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SvatekDnes App Store
    dependencies:
      - target: SvatekWidget
        embed: true
  SvatekWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SvatekWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.fh.svatekdnes.widget
        INFOPLIST_FILE: SvatekWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SvatekWidget/SvatekWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SvatekDnes Widget App Store
  SvatekDnesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.fh.svatekdnes-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SvatekDnes
  SvatekDnesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.fh.svatekdnes-uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SvatekDnes
schemes:
  SvatekDnes:
    build:
      targets:
        SvatekDnes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SvatekDnesTests
        - SvatekDnesUITests
